# Supported SDK CLI workflow. Copy to .ad-sdlc/config/workflow.yaml.
# Full contract and migration: docs/configuration/RUNTIME_WORKFLOW.md
# init emits just version and pipeline.default_mode; all settings below are optional.
version: '1.0.0'
pipeline:
  default_mode: greenfield # greenfield (19 slots), enhancement (15), import (5)
execution:
  local_mode: false # --local substitutes local agents and removes GitHub setup
  max_parallel_stages: 3 # concurrent runnable DAG stages, NOT a worker-pool limit
  stage_timeout_ms: 300000 # total per-stage budget across attempts and backoff
  stage_timeouts_ms:
    orchestration: 300000 # controller stage
    implementation: 1800000 # worker stage, separate from orchestration
global:
  approval_mode: auto # manual prompts at existing gates; critical checks prior failures
  retry_policy:
    max_attempts: 4 # includes the first; preserves the live maxRetries: 3 default
    backoff: exponential # fixed | linear | exponential | fibonacci
    base_delay_seconds: 5
    max_delay_seconds: 60
  timeouts: # seconds, translated once to concrete stage budgets
    document_generation: 300 # generation AND update stages (see mapping in reference)
    issue_creation: 300
    orchestration: 300
    implementation: 1800
    pr_review: 300
  vnv:
    rigor: standard # minimal | standard | strict
    halt_on_verification_failure: false # blocks only with rigor: strict
# Descriptive extension data is accepted but never interpreted as runtime policy.
extensions:
  team: example
